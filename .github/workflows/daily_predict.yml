name: Daily Predictions

on:
  schedule:
    - cron: "0 11 * * *"  # 6 AM ET (11 UTC)
  workflow_dispatch:

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The SQLite DB, raw SDS updates and MLB API caches aren't in git, so
      # carry them between runs. A cold cache rebuilds everything (~15 min).
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: |
            data/predictor.db
            data/raw
            data/cache
          key: predictor-data-${{ github.run_id }}
          restore-keys: predictor-data-

      - name: Update data, retrain if a new attribute update landed, score cards
        run: python scripts/daily_predict.py

      - name: Export static predictions
        run: python scripts/export_static_predictions.py

      - uses: actions/upload-artifact@v4
        with:
          name: predictions
          path: |
            data/static_predictions.json
            data/models/backtest_summary.json
