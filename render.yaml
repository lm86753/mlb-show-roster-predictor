services:
  - type: web
    name: mlb-show-roster-predictor-api
    env: python
    buildCommand: pip install -r requirements-backend.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: VERIFY
        value: "1"
